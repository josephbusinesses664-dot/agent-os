services:
  app:
    command: ["agent-os", "start"]
    restart: unless-stopped
    env_file:
      - ./agent-tokens.env
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-deepseek}
      MATTERMOST_CHANNEL: ${MATTERMOST_CHANNEL:-town-square}
      MATTERMOST_ENABLED: "true"
      MATTERMOST_POLL_INTERVAL: ${MATTERMOST_POLL_INTERVAL:-10}
      GLOBAL_BUDGET_MONTHLY: ${GLOBAL_BUDGET_MONTHLY:-100.0}
      GLOBAL_BUDGET_DAILY: ${GLOBAL_BUDGET_DAILY:-20.0}
      REQUIRE_APPROVAL_RISK: ${REQUIRE_APPROVAL_RISK:-medium}
    volumes:
      - ./sitecustomize.py:/app/sitecustomize.py
  worker:
    restart: unless-stopped
    env_file:
      - ./agent-tokens.env
    environment:
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-deepseek}
      REQUIRE_APPROVAL_RISK: ${REQUIRE_APPROVAL_RISK:-medium}
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
networks:
  default:
    external: true
    name: agentos-net
